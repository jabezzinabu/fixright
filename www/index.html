<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grant Assistant · Proposal Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&family=Fraunces:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito Sans', sans-serif;
    background: linear-gradient(160deg, #EEEAFF 0%, #F5F3FF 50%, #EEF0FF 100%);
    min-height: 100vh;
  }

  /* ── FORM ── */
  #form-view {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 40px 20px;
  }
  .form-inner { width: 100%; max-width: 500px; }

  .brand-pill {
    display: inline-flex; align-items: center; gap: 10px;
    background: white; border-radius: 100px;
    padding: 8px 18px;
    box-shadow: 0 2px 12px rgba(75,59,255,.12);
    margin-bottom: 28px;
  }
  .brand-pill img { height: 28px; border-radius: 6px; }
  .brand-pill span { font-size: 13px; font-weight: 700; color: #4b3bff; letter-spacing: .3px; }

  .form-title {
    font-family: 'Fraunces', serif;
    font-size: 40px; font-weight: 600;
    color: #0f1222; line-height: 1.15; margin-bottom: 10px;
  }
  .form-subtitle { font-size: 15px; color: #5a5f7a; line-height: 1.6; margin-bottom: 36px; }

  .form-card {
    background: white; border-radius: 18px;
    padding: 34px; box-shadow: 0 8px 36px rgba(75,59,255,.1), 0 2px 8px rgba(0,0,0,.04);
  }

  .field { margin-bottom: 20px; }
  label {
    display: block; font-size: 11px; font-weight: 700;
    letter-spacing: .18em; text-transform: uppercase;
    color: #4b3bff; margin-bottom: 8px;
  }
  input, select {
    width: 100%; background: #f6f3ff;
    border: 1.5px solid #d7cffb; border-radius: 9px;
    padding: 13px 15px;
    font-family: 'Inter', sans-serif;
    font-size: 14.5px; color: #0f1222;
    outline: none; transition: all .2s;
    appearance: none; -webkit-appearance: none;
  }
  input:focus, select:focus {
    border-color: #4b3bff; background: white;
    box-shadow: 0 0 0 4px rgba(75,59,255,.1);
  }
  input::placeholder { color: #9da3be; }
  select { cursor: pointer; }
  .amount-wrap { position: relative; }
  .amount-prefix {
    position: absolute; left: 15px; top: 50%;
    transform: translateY(-50%);
    font-size: 14.5px; color: #5a5f7a; pointer-events: none;
  }
  .amount-wrap input { padding-left: 26px; }

  .error-box {
    background: #fff0f0; border: 1px solid #ffcdd2;
    border-radius: 9px; padding: 11px 15px;
    font-size: 13px; color: #c62828;
    margin-bottom: 18px; display: none;
  }

  .btn-primary {
    width: 100%; background: linear-gradient(135deg, #4b3bff, #6a5cff);
    color: white; border: none; border-radius: 11px;
    padding: 15px 32px;
    font-family: 'Nunito Sans', sans-serif;
    font-size: 15px; font-weight: 700;
    cursor: pointer; transition: all .2s; letter-spacing: .2px;
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(75,59,255,.35); }

  .form-hint { text-align: center; font-size: 12px; color: #9da3be; margin-top: 18px; }

  /* ── PREVIEW ── */
  #preview-view { display: none; padding: 0; }

  .toolbar {
    position: sticky; top: 0; z-index: 100;
    background: white; border-bottom: 1px solid #e6e4f2;
    padding: 14px 28px;
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 10px;
    box-shadow: 0 2px 12px rgba(75,59,255,.08);
  }
  .toolbar-left { display: flex; align-items: center; gap: 12px; }
  .toolbar-left img { height: 26px; border-radius: 5px; }
  .toolbar-title {
    font-family: 'Fraunces', serif;
    font-size: 17px; font-weight: 600; color: #0f1222;
  }
  .toolbar-actions { display: flex; gap: 10px; }
  .btn-back {
    background: transparent; color: #4b3bff;
    border: 1.5px solid #4b3bff; border-radius: 9px;
    padding: 9px 20px;
    font-family: 'Nunito Sans', sans-serif;
    font-size: 13px; font-weight: 700;
    cursor: pointer; transition: all .2s;
  }
  .btn-back:hover { background: #4b3bff; color: white; }
  .btn-pdf {
    background: linear-gradient(135deg, #4b3bff, #6a5cff);
    color: white; border: none; border-radius: 9px;
    padding: 9px 20px;
    font-family: 'Nunito Sans', sans-serif;
    font-size: 13px; font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(75,59,255,.28);
    transition: all .2s;
  }
  .btn-pdf:hover { transform: translateY(-1px); box-shadow: 0 8px 22px rgba(75,59,255,.38); }
  .btn-pdf:disabled { opacity: .6; cursor: not-allowed; transform: none; }

  #proposal-frame {
    width: 100%; height: calc(100vh - 60px);
    border: none; background: #e9e9ef;
  }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; } }
  .fade-in { animation: fadeIn .4s ease forwards; }

  @media (max-width: 560px) {
    .form-title { font-size: 32px; }
    .toolbar { padding: 12px 16px; }
  }
</style>
</head>
<body>

      <h1 class="form-title">Proposal Generator</h1>
      <p class="form-subtitle">Enter prospect details to generate a branded,<br>print-ready partnership proposal instantly.</p>
    </div>

    <div class="form-card">
      <div class="field">
        <label for="org-name">Organization Name</label>
        <input type="text" id="org-name" placeholder="e.g. City Harvest, Year Up..." autocomplete="off">
      </div>
      <div class="field">
        <label for="mission-area">Mission Area</label>
        <select id="mission-area">
          <option value="">Select a mission area...</option>
          <option>Education &amp; Youth Development</option>
          <option>Health &amp; Human Services</option>
          <option>Arts &amp; Culture</option>
          <option>Environmental &amp; Conservation</option>
          <option>Housing &amp; Homelessness</option>
          <option>Food Security &amp; Hunger Relief</option>
          <option>Community Development</option>
          <option>Workforce Development</option>
          <option>Mental Health &amp; Substance Use</option>
          <option>Animal Welfare</option>
          <option>Disability Services</option>
          <option>Immigrant &amp; Refugee Services</option>
          <option>Criminal Justice &amp; Reentry</option>
          <option>Civic Engagement &amp; Advocacy</option>
          <option>Other / General Nonprofit</option>
        </select>
      </div>
      <div class="field" style="margin-bottom:28px;">
        <label for="amount">Quote Amount</label>
        <div class="amount-wrap">
          <span class="amount-prefix">$</span>
          <input type="text" id="amount" placeholder="12,000" autocomplete="off">
        </div>
      </div>

      <div class="error-box" id="error-box"></div>
      <button class="btn-primary" onclick="generateProposal()">Generate Proposal →</button>
    </div>
    <p class="form-hint">Generates a 5-page print-ready PDF proposal</p>
  </div>
</div>

<!-- ═══ PREVIEW ═══ -->
<div id="preview-view">

row.</p>\n      </div>\n      <div class=\"scard\">\n        <h3>Trainings for Every Level</h3>\n        <p>{{SUPPORT_TRAINING}}</p>\n      </div>\n      <div class=\"scard\">\n        <h3>{{USERS_CARD_TITLE}}</h3>\n        <p>{{USERS_CARD_BODY}}</p>\n      </div>\n      <div class=\"scard\">\n        <h3>Enterprise Security</h3>\n        <p>{{SUPPORT_SECURITY}}</p>\n      </div>\n    </div>\n\n    <hr class=\"divider\" />\n\n    <div class=\"eyebrow\">EXPECTED OUTCOMES</div>\n    <h2>{{OUTCOMES_HEADLINE}}</h2>\n\n    <ul class=\"bullets\">\n      {{OUTCOMES_BULLETS}}\n    </ul>\n  </section>\n\n  <!-- PAGE 5 \u2014 INVESTMENT / NEXT STEPS / QUOTE / FOOTER -->\n  <section class=\"page\">\n    <div class=\"eyebrow\">INVESTMENT</div>\n    <h2>Your Partnership Investment</h2>\n\n    <div class=\"invest\">\n      <div class=\"eyebrow\">{{PRICE_TIER_LABEL}}</div>\n      <div class=\"price-row\">\n        <div class=\"price\">{{PRICE}}<span class=\"per\">per year</span></div>\n      </div>\n      <p>{{PRICE_DESCRIPTION}}</p>\n    </div>\n\n    <hr class=\"divider\" />\n\n    <div class=\"eyebrow\">NEXT STEPS</div>\n    <h2>Let's Get Started</h2>\n\n    <div class=\"steps\">\n      <div class=\"step\">\n        <div class=\"num\">1</div>\n        <p>{{NEXT_STEP_1}}</p>\n      </div>\n      <div class=\"step\">\n        <div class=\"num\">2</div>\n        <p>{{NEXT_STEP_2}}</p>\n      </div>\n      <div class=\"step\">\n        <div class=\"num\">3</div>\n        <p>{{NEXT_STEP_3}}</p>\n      </div>\n    </div>\n\n    <div class=\"quote\" style=\"margin-top:18px;\">\n      <div class=\"mark\">&ldquo;</div>\n      <p>Grant Assistant and FreeWill have helped us rethink our grant writing and fundraising strategies. This $300,000 grant is making a huge impact on our student community. Grant Assistant is a great asset for every institution that would like to stay up-to-date, be time efficient, be creative, and look for new ways to tell their story.</p>\n      <div class=\"name\" const MISSION_AREAS = Object.keys(CONTENT);

function today() {
  return new Date().toLocaleDateString('en-US', {year:'numeric',month:'long',day:'numeric'});
}

function fmtAmount(raw) {
  const n = Number(String(raw).replace(/[^0-9]/g, ''));
  return isNaN(n) ? raw : '$' + n.toLocaleString();
}

function li(arr) {
  return arr.join('\n          ');
}

function fillTemplate(orgName, missionArea, amount) {
  const c = CONTENT[missionArea] || CONTENT['Other / General Nonprofit'];
  const amt = fmtAmount(amount);

  return TEMPLATE
    .replace(/{{PROSPECT_NAME}}/g, orgName)
    .replace(/{{PROPOSAL_DATE}}/g, today())
    .replace(/{{EXEC_SUMMARY_HEADLINE}}/g, c.execSummaryHeadline)
    .replace(/{{EXEC_SUMMARY_P1}}/g, c.execSummaryP1)
    .replace(/{{EXEC_SUMMARY_P2}}/g, c.execSummaryP2)
    .replace(/{{CHALLENGE_HEADLINE}}/g, c.challengeHeadline)
    .replace(/{{CHALLENGE_BODY}}/g, c.challengeBody)
    .replace(/{{STAT_1_NUMBER}}/g, '35,000<span class="plus">+</span>')
    .replace(/{{STAT_1_LABEL}}/g, 'grant opportunities available in Discover, updated weekly')
    .replace(/{{STAT_2_NUMBER}}/g, '40<span class="pct">%+</span>')
    .replace(/{{STAT_2_LABEL}}/g, 'reduction in grant writing time across partner teams')
    .replace(/{{DISCOVER_DESCRIPTION}}/g, c.discoverDescription)
    .replace(/{{RESPOND_DESCRIPTION}}/g, c.respondDescription)
    .replace(/{{ONBOARDING_INTRO}}/g, c.onboardingIntro)
    .replace(/{{PHASE_1_BULLETS}}/g, li(c.phase1Bullets))
    .replace(/{{PHASE_2_BULLETS}}/g, li(c.phase2Bullets))
    .replace(/{{PHASE_3_BULLETS}}/g, li(c.phase3Bullets))
    .replace(/{{SUPPORT_STRATEGIST}}/g, c.supportStrategist)
    .replace(/{{SUPPORT_RESEARCH}}/g, c.supportResearch)
    .replace(/{{SUPPORT_TRAINING}}/g, c.supportTraining)
    .replace(/{{USERS_CARD_TITLE}}/g, c.usersCardTitle)
    .replace(/{{USERS_CARD_BODY}}/g, c.usersCardBody)
    .replace(/{{SUPPORT_SECURITY}}/g, c.supportSecurity)
    .replace(/{{OUTCOMES_HEADLINE}}/g, 'What Success Looks Like for ' + orgName)
    .replace(/{{OUTCOMES_BULLETS}}/g, li(c.outcomesBullets))
    .replace(/{{PRICE_TIER_LABEL}}/g, 'ANNUAL PARTNERSHIP')
    .replace(/{{PRICE}}/g, amt)
    .replace(/{{PRICE_DESCRIPTION}}/g, 'This partnership represents a focused, strategic investment in ' + orgName + '\u2019s long-term funding capacity. Partners across our network consistently report meaningful increases in grant activity and writing efficiency \u2014 with the platform paying for itself many times over through new funding secured.')
    .replace(/{{NEXT_STEP_1}}/g, 'Review and countersign the partnership agreement to officially kick off your Grant Assistant engagement with ' + orgName + '.')
    .replace(/{{NEXT_STEP_2}}/g, 'Complete your onboarding session with your dedicated Strategist to build your organization profile, program library, and initial grant goals.')
    .replace(/{{NEXT_STEP_3}}/g, 'Begin discovering and responding to grant opportunities in the platform \u2014 your Strategist will personally curate the first batch of best-fit funders for ' + orgName + '.');
}

let _filledHTML = '';

function generateProposal() {
  const orgName = document.getElementById('org-name').value.trim();
  const missionArea = document.getElementById('mission-area').value;
  const amount = document.getElementById('amount').value.trim();
  const errorBox = document.getElementById('error-box');

  if (!orgName) { showError('Please enter the organization name.'); return; }
  if (!missionArea) { showError('Please select a mission area.'); return; }
  if (!amount) { showError('Please enter the quote amount.'); return; }

  errorBox.style.display = 'none';

  _filledHTML = fillTemplate(orgName, missionArea, amount);

  // Set iframe content
  const frame = document.getElementById('proposal-frame');
  frame.srcdoc = _filledHTML;

  document.getElementById('toolbar-title').textContent = 'Proposal for ' + orgName;
  document.getElementById('form-view').style.display = 'none';
  document.getElementById('preview-view').style.display = 'block';
  window.scrollTo(0, 0);
}

function showForm() {
  document.getElementById('preview-view').style.display = 'none';
  document.getElementById('form-view').style.display = 'flex';
  window.scrollTo(0, 0);
}

function downloadPDF() {
  if (!_filledHTML) return;
  const btn = document.getElementById('pdf-btn');
  btn.disabled = true;
  btn.textContent = 'Opening…';

  const orgName = document.getElementById('toolbar-title').textContent.replace('Proposal for ', '');
  const blob = new Blob([_filledHTML], {type: 'text/html; charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const win = window.open(url, '_blank');

  if (!win) {
    btn.disabled = false;
    btn.textContent = '\u2193 Download PDF';
    alert('Please allow pop-ups from this site, then click Download PDF again.');
    return;
  }

  win.addEventListener('load', function() {
    if (win.document && win.document.fonts) {
      win.document.fonts.ready.then(function() {
        setTimeout(function() {
          win.focus();
          win.print();
          URL.revokeObjectURL(url);
          btn.disabled = false;
          btn.textContent = '\u2193 Download PDF';
        }, 600);
      });
    } else {
      setTimeout(function() {
        win.focus();
        win.print();
        URL.revokeObjectURL(url);
        btn.disabled = false;
        btn.textContent = '\u2193 Download PDF';
      }, 1800);
    }
  }, {once: true});

  // Fallback
  setTimeout(function() {
    btn.disabled = false;
    btn.textContent = '\u2193 Download PDF';
  }, 10000);
}

function showError(msg) {
  const box = document.getElementById('error-box');
  box.textContent = msg;
  box.style.display = 'block';
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && document.getElementById('form-view').style.display !== 'none') {
    generateProposal();
  }
});
</script>
